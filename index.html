<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Objectly | High-Quality Free 3D Icon Packs</title>
    <meta
      name="description"
      content="A free, premium 3D icon library with multiple packs spanning Ecommerce, Finance, AI, and more. Attribution appreciated, not required, free for commercial use."
    />

    <link rel="icon" href="/assets/Brand/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/assets/Brand/favicon-dark.png" media="(prefers-color-scheme: dark)" />

    <meta property="og:title" content="Objectly | High-Quality Free 3D Icon Packs" />
    <meta
      property="og:description"
      content="A free, premium 3D icon library with multiple packs spanning Ecommerce, Finance, AI, and more. Attribution appreciated, not required, free for commercial use."
    />
    <!-- Absolute URLs: social scrapers do not resolve relative paths, and the
         host must be one that actually serves the file. -->
    <meta property="og:url" content="https://objectly.thepixelyokai.workers.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://objectly.thepixelyokai.workers.dev/assets/Brand/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://objectly.thepixelyokai.workers.dev/assets/Brand/og-image.png" />

    <link rel="preload" as="font" type="font/woff2" href="/assets/OpenRunde/OpenRunde-Regular.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/OpenRunde/OpenRunde-Medium.woff2" crossorigin />
    <script>
      // Applied before paint so the first frame isn't the wrong theme.
      if (
        localStorage.theme === "dark" ||
        (!localStorage.theme && matchMedia("(prefers-color-scheme: dark)").matches)
      )
        document.documentElement.classList.add("dark");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
